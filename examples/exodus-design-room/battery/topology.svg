<svg xmlns="http://www.w3.org/2000/svg" width="920" height="335" viewBox="0 0 920 335"><title>Battery loop: the returned branch is not load output</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#234"/></marker></defs><rect width="920" height="335" fill="white"/><rect x="15" y="18" width="735" height="296" rx="12" fill="#f1f8f8" stroke="#345" stroke-dasharray="7 5"/><g font-family="sans-serif" font-size="17" fill="#143248"><text x="32" y="49">Device boundary · no external supply after startup</text><text x="42" y="155">Battery</text><text x="200" y="143">DC bus</text><text x="353" y="143">Stage</text><text x="510" y="143">Gross output</text><text x="784" y="155">Useful load</text><text x="394" y="251">Return converter</text><text x="136" y="92">Auxiliaries</text><text x="287" y="190">Return power at bus</text><text x="535" y="87">Split once, not twice</text><text x="42" y="293">Positive net battery current leaves the battery. Return at the bus can offset that draw.</text></g><g stroke="#234" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M107 156 H204" marker-start="url(#a)"/><path d="M227 156 H364"/><path d="M386 156 H567"/><path d="M570 156 H775"/><path d="M568 156 V222 H455"/><path d="M443 222 H217 V161"/><path d="M217 151 V100"/></g></svg>