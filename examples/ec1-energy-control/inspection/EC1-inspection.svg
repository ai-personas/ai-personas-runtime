<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><title>EC1 Rev A • bare-board inspection, component side, 1:1</title><text x="15" y="15" font-size="3.3" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#165b65" text-anchor="start">BENCH INSPECTION   /   EC1 REV A</text><text x="195" y="15" font-size="3.2" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#596a70" text-anchor="end">A4    •    1 OF 1</text><line x1="15" y1="19" x2="195" y2="19" stroke="#165b65" stroke-width="0.4" /><text x="15" y="31" font-size="8" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="start">Bare-board hole check</text><text x="15" y="38" font-size="3.8" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Component side up   /   unpowered   /   dimensions in millimetres</text><text x="15" y="53" font-size="4.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#165b65" text-anchor="start">01   Check the print scale</text><text x="15" y="62" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Print this PDF on A4 at Actual size (100%).</text><text x="15" y="68" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Turn off Fit, Shrink and borderless expansion.</text><text x="15" y="77" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Measure between the tick centres in both directions.</text><text x="15" y="83" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">If either length is wrong, do not use the overlay.</text><g id="scale-check"><line x1="137" y1="59" x2="187" y2="59" stroke="#162c36" stroke-width="0.25" /><line x1="137" y1="57" x2="137" y2="61" stroke="#162c36" stroke-width="0.25" /><line x1="187" y1="57" x2="187" y2="81" stroke="#162c36" stroke-width="0.25" /><line x1="185" y1="59" x2="189" y2="59" stroke="#162c36" stroke-width="0.25" /><line x1="185" y1="79" x2="189" y2="79" stroke="#162c36" stroke-width="0.25" /><text x="162" y="56" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">50 mm</text><text x="183" y="71" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="end">20 mm</text></g><line x1="15" y1="90" x2="195" y2="90" stroke="#596a70" stroke-width="0.24" /><text x="15" y="101" font-size="4.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#165b65" text-anchor="start">02   Align the board</text><text x="15" y="110" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Set the bare board on the rectangle. Match all four edges with IN at the upper left,</text><text x="15" y="116" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">LOAD at the upper right and G below LOAD. Look straight down through each hole.</text><g id="component-side-overlay"><rect x="25" y="132" width="54" height="34" fill="none" stroke="#162c36" stroke-width="0.18" /><circle id="hole-1" cx="32" cy="142" r="0.55" fill="#000000" /><circle id="hole-2" cx="32" cy="145" r="0.55" fill="#000000" /><circle id="hole-3" cx="52" cy="142" r="0.55" fill="#000000" /><circle id="hole-4" cx="52" cy="145" r="0.55" fill="#000000" /><circle id="hole-5" cx="71" cy="142" r="0.55" fill="#000000" /><circle id="hole-6" cx="71" cy="145" r="0.55" fill="#000000" /><circle id="hole-7" cx="71" cy="158" r="0.55" fill="#000000" /><circle id="hole-8" cx="71" cy="161" r="0.55" fill="#000000" /><circle id="hole-9" cx="52" cy="154" r="0.5" fill="#000000" /><circle id="hole-10" cx="57" cy="154" r="0.5" fill="#000000" /><text x="32" y="139" font-size="2.6" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">IN</text><text x="52" y="139" font-size="2.6" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">STORE</text><text x="71" y="139" font-size="2.6" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">LOAD</text><text x="71" y="155" font-size="2.6" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">G</text><text x="52" y="158" font-size="2.6" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">+</text><text x="57" y="158" font-size="2.6" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">−</text><line x1="24.2" y1="132" x2="22" y2="132" stroke="#596a70" stroke-width="0.18" /><line x1="25" y1="131.2" x2="25" y2="129" stroke="#596a70" stroke-width="0.18" /><line x1="24.2" y1="166" x2="22" y2="166" stroke="#596a70" stroke-width="0.18" /><line x1="25" y1="166.8" x2="25" y2="169" stroke="#596a70" stroke-width="0.18" /><line x1="79.8" y1="132" x2="82" y2="132" stroke="#596a70" stroke-width="0.18" /><line x1="79" y1="131.2" x2="79" y2="129" stroke="#596a70" stroke-width="0.18" /><line x1="79.8" y1="166" x2="82" y2="166" stroke="#596a70" stroke-width="0.18" /><line x1="79" y1="166.8" x2="79" y2="169" stroke="#596a70" stroke-width="0.18" /></g><text x="52" y="174" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="middle">54 × 34 mm    /    1:1</text><text x="94" y="134" font-size="4.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="start">What to look for</text><text x="94" y="143" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Each opening should be centred on a black</text><text x="94" y="149" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">disc. The disc is the nominal drill diameter,</text><text x="94" y="155" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">not the copper pad. Check every position</text><text x="94" y="161" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">against the list below. Flag missing, extra</text><text x="94" y="167" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">or visibly offset holes for measurement.</text><line x1="15" y1="182" x2="195" y2="182" stroke="#596a70" stroke-width="0.24" /><text x="15" y="193" font-size="4.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#165b65" text-anchor="start">03   Identify all ten holes</text><text x="15" y="201" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Centres measured from the upper-left board corner: X to the right, Y down.</text><rect x="15" y="206" width="180" height="8" fill="#e5eeee" stroke="none" stroke-width="0.2" /><text x="17" y="211.6" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="start">Feature</text><text x="68" y="211.6" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="start">X (mm)</text><text x="102" y="211.6" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="start">Y (mm)</text><text x="148" y="211.6" font-size="3.5" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#162c36" text-anchor="start">Nominal Ø</text><text x="17" y="220.0" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">TP1   IN loop</text><text x="68" y="220.0" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">7</text><text x="102" y="220.0" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">10 and 13</text><text x="148" y="220.0" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">1.10 mm</text><line x1="15" y1="222.0" x2="195" y2="222.0" stroke="#9aabad" stroke-width="0.13" /><text x="17" y="226.7" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">TP2   STORE loop</text><text x="68" y="226.7" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">27</text><text x="102" y="226.7" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">10 and 13</text><text x="148" y="226.7" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">1.10 mm</text><line x1="15" y1="228.7" x2="195" y2="228.7" stroke="#9aabad" stroke-width="0.13" /><text x="17" y="233.4" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">TP3   LOAD loop</text><text x="68" y="233.4" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">46</text><text x="102" y="233.4" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">10 and 13</text><text x="148" y="233.4" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">1.10 mm</text><line x1="15" y1="235.4" x2="195" y2="235.4" stroke="#9aabad" stroke-width="0.13" /><text x="17" y="240.1" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">TP4   G loop</text><text x="68" y="240.1" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">46</text><text x="102" y="240.1" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">26 and 29</text><text x="148" y="240.1" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">1.10 mm</text><line x1="15" y1="242.1" x2="195" y2="242.1" stroke="#9aabad" stroke-width="0.13" /><text x="17" y="246.8" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">C1.1   positive (+)</text><text x="68" y="246.8" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">27</text><text x="102" y="246.8" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">22</text><text x="148" y="246.8" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">1.00 mm</text><line x1="15" y1="248.8" x2="195" y2="248.8" stroke="#9aabad" stroke-width="0.13" /><text x="17" y="253.5" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">C1.2   negative (−)</text><text x="68" y="253.5" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">32</text><text x="102" y="253.5" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">22</text><text x="148" y="253.5" font-size="3.4" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">1.00 mm</text><line x1="15" y1="255.5" x2="195" y2="255.5" stroke="#9aabad" stroke-width="0.13" /><text x="15" y="266" font-size="4.2" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#165b65" text-anchor="start">Paper is a visual screen, not a gauge.</text><text x="15" y="273" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">Paper cannot verify finished bore size, tolerance, plating, continuity or function.</text><text x="15" y="279" font-size="3.6" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#162c36" text-anchor="start">For acceptance, use calibrated gauges or dimensional inspection. Keep power off.</text><text x="15" y="288" font-size="3.1" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#596a70" text-anchor="start">Reference: EC1 Rev A   /   EC1.kicad_pcb   •   EC1-Edge_Cuts.gbr   •   EC1.drl</text></svg>