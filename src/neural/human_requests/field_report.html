<h2>Field report</h2>
<p class="instructions">Record what you did or observed. Return the saved report to the person handling this request in Studio.</p>
<div class="field-entry"><label for="field-observer">Your name or role</label>
<input class="field-screen" id="field-observer" required><div class="field-print" id="printed-observer"></div></div>
<div class="field-entry"><label for="field-observations">Observations and outstanding questions</label>
<textarea class="field-screen" id="field-observations" rows="4" required></textarea><div class="field-print" id="printed-observations"></div></div>
<div class="field-entry"><label for="field-originals">Supporting evidence</label>
<div class="field-screen"><p class="instructions">Choose any files you will return with the report. Keep the originals together with the downloaded JSON.</p>
<input type="file" id="field-originals" multiple></div><div class="field-print" id="printed-evidence"></div></div>
<div class="field-screen"><button type="button" id="field-save" disabled>Save field report</button>
<p role="status" id="field-status"></p><noscript>Enable JavaScript to save a digital report, or print this sheet and fill it out on paper.</noscript></div>
