[package]
name = "ai-personas"
default-run = "ai-personas"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Continuing personas with explicit context, responsibility, and evidence"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "=0.1.20"
sha2 = "0.10"
hex = "0.4"
regex = "1"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
bytes = "1"

jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
base64 = "=0.22.1"
getrandom = "=0.3.4"
url = "2"
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "wat", "validate", "portable-dispatch", "deterministic"] }
