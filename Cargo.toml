[package]
name = "ai-personas"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Continuing personas with explicit context, responsibility, and evidence"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
